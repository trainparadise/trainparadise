
<!doctype html>
<html>
    <head>
        <title>鉄道の楽園 Blog</title>
        <meta charset="UTF-8">
        <style>
            body {
                font-family: sans-serif;
            }

            .titlearea {
                display: flex;
                height: 72px;
                align-items: flex-end;
            }

            button {
                background: transparent;
                color: #00dba0;
                border: 2px solid #00dba0;
                padding: 12px 12px;
                font-size: 16px;
                border-radius: 8px;
                width: 96px;
                height: 36px;
            }

            .title {
                font-size: 36px;
            }

            .subtitle {
                font-size: 18px;
                padding: 4px 6px;
                border-left: 4px solid #00dba0;
                background-color: #f2f2f2;
                color: #333;
            }
        </style>
    </head>

    <body>
        <div class="titlearea">
            <p class="title">鉄道の楽園 Blog</p>
            <button type="button">ホーム</button>
            <button type="button">会員登録</button>
            <button type="button">ログイン</button>
        </div>
        <p class="subtitle">ブログ一覧</p>
        <ul>
            {% for post in site.posts %}
            <li><a href="{{ post.url }}">{{ post.title }}</a></li>
            {% endfor %}
        </ul>
    </body>
</html>
