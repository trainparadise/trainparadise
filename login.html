layout: default
title: 鉄道の楽園
---

<div>
    <button onclick="showLogin()">ログイン</button>
    <button onclick="showSignup()">新規登録</button>
</div>

<div id="loginForm">
    <input type="email" id="loginemail" placeholder="メールアドレス">
    <input type="password" id="loginpassword" placeholder="パスワード">
    <button onclick="login()">ログイン</button>
</div>

<div id="signupForm" style="display:none;">
    <input type="text" id="signupusername" placeholder="ユーザー名">
    <input type="email" id="signupemail" placeholder="メールアドレス">
    <input type="password" id="signuppassword" placeholder="パスワード">
    <button onclick="signup()">登録</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
    function showLogin() {
        document.getElementById("loginForm").style.display = "block";
        document.getElementById("signupForm").style.display = "none";
    }
    
    function showSignup() {
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("signupForm").style.display = "block";
    }
</script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA2uk7D79EDeX8OKfW1yxlwY4nEnaN3ZNE",
        authDomain: "trainparadise-c95a6.firebaseapp.com",
        projectId: "trainparadise-c95a6",
        storageBucket: "trainparadise-c95a6.firebasestorage.app",
        messagingSenderId: "940085797559",
        appId: "1:940085797559:web:d704214d11b8420342a332"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function login() {
        const email = document.getElementById("loginemail").value;
        const password = document.getElementById("loginpassword").value;
        
        auth.signInWithEmailAndPassword(email, password)
            .then(() => {
                alert("ログインが成功しました");
            })
            .catch(error => {
                alert(error.message);
            });
    }
    
    function signup() {
        const username = document.getElementById("signupusername").value;
        const email = document.getElementById("signupemail").value;
        const password = document.getElementById("signuppassword").value;

        if (!username) {
            alert("ユーザー名を入力してください");
            return;
        }
        
        auth.createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                
                return db.collection("users").doc(user.uid).set({
                    username: username,
                    email: email,
                    coins: 0,
                    createdAt: new Date()
                });
            })
            .then(() => {
                alert("登録が成功しました");
            })
            .catch(error => {
                alert(error.message);
            });
    }
</script>
